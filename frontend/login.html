<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigitalBank | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-logo">
                <div class="logo-circle">DB</div>
                <h1>DigitalBank</h1>
                <p>Secure Digital Banking</p>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Login to access your account</p>
            </div>

            <form id="loginForm">

                <div class="login-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="login-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-options">

                    <a
                        href="#"
                        id="forgotPassword"
                    >
                        Forgot Password?
                    </a>

                </div>


                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="login-register">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>
</html>
